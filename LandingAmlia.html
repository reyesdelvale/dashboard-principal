<body>
  <div id="__bundler_placeholder">Loading Amlia — Detección AML con IA...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

x, 5vw, 64px) 40px\">\n<div style=\"max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 48px 56px\">\n<div style=\"flex: 1 1 420px; min-width: 0\">\n<div style=\"display: inline-flex; align-items: center; gap: 10px; background: #E3EEFF; color: #1E4FBF; font-size: 13px; font-weight: 700; padding: 8px 14px; border-radius: 999px\">\n<span style=\"width: 8px; height: 8px; border-radius: 50%; background: #0FA39A\"><\u002Fspan>Detección AML con inteligencia artificial<\u002Fdiv>\n<h1 style=\"margin: 20px 0 0; font-size: clamp(2.3rem, 4.6vw, 3.6rem); font-weight: 800; line-height: 1.08; color: #0A2463; letter-spacing: -0.02em\">Que su equipo investigue <span style=\"color: #1E5BD8\">lavado<\u002Fspan>, no falsos positivos.<\u002Fh1>\n<div style=\"width: 64px; height: 4px; background: #0FA39A; border-radius: 4px; margin: 24px 0\"><\u002Fdiv>\n<p style=\"margin: 0; max-width: 580px; font-size: 1.1rem; line-height: 1.75; color: #3B4A63\">Amlia suma motores de IA a su sistema de reglas actual. Detectan patrones, anomalías y redes que las reglas no ven, y entregan cada alerta con evidencia trazable para sustentarla ante el regulador.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px\">\n<a href=\"#contacto\" style=\"display: inline-flex; align-items: center; min-height: 52px; padding: 0 26px; background: #1E5BD8; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 700; border-radius: 12px\">Agendar una POC de 90 minutos<\u002Fa>\n<a href=\"#como-funciona\" style=\"display: inline-flex; align-items: center; min-height: 52px; padding: 0 26px; background: #FFFFFF; border: 1.5px solid #B9CBEA; color: #0A2463; text-decoration: none; font-size: 15px; font-weight: 700; border-radius: 12px\">Ver cómo funciona<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Vista de la plataforma -->\n<div style=\"flex: 1 1 520px; min-width: 0\">\n<div style=\"display: flex; align-items: center; gap: 12px; margin-botto fr)); gap: 10px\">\n<div style=\"border: 1px solid #DCE5F2; border-radius: 12px; padding: 12px\"><div style=\"font-size: 11px; color: #5A6880\">Transacciones analizadas<\u002Fdiv><div style=\"font-size: 20px; font-weight: 800; color: #0A2463\">1.425.617<\u002Fdiv><\u002Fdiv>\n<div style=\"border: 1px solid #DCE5F2; border-radius: 12px; padding: 12px\"><div style=\"font-size: 11px; color: #5A6880\">Cuentas evaluadas<\u002Fdiv><div style=\"font-size: 20px; font-weight: 800; color: #0A2463\">101.169<\u002Fdiv><\u002Fdiv>\n<div style=\"border: 1px solid #DCE5F2; border-radius: 12px; padding: 12px\"><div style=\"font-size: 11px; color: #5A6880\">Lavado detectado (recall)<\u002Fdiv><div style=\"font-size: 20px; font-weight: 800; color: #0B7F4F\">98,4%<\u002Fdiv><\u002Fdiv>\n<div style=\"border: 1px solid #DCE5F2; border-radius: 12px; padding: 12px\"><div style=\"font-size: 11px; color: #5A6880\">Cuentas normales alertadas<\u002Fdiv><div style=\"font-size: 20px; font-weight: 800; color: #0A2463\">3,00%<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font-size: 13px; font-weight: 700; color: #0A2463; margin: 16px 0 8px\">Motores activos<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<div style=\"display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 8px 10px; background: #F3F6FB; border-radius: 8px\"><span style=\"color: #0A2463; font-weight: 600\">Secuencias<\u002Fspan><span style=\"font-size: 11px; font-weight: 700; color: #0B7F4F; background: #E2F5EA; padding: 2px 8px; border-radius: 999px\">Activo<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 8px 10px; background: #F3F6FB; border-radius: 8px\"><span style=\"color: #0A2463; font-weight: 600\">Redes<\u002Fspan><span style=\"font-size: 11px; font-weight: 700; color: #0B7F4F; background: #E2F5EA; padding: 2px 8px; border-radius: 999px\">Activo<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 8px 10px; background: #F3F6FB; border-radius: 8px\"><span style=\"color: #0A2463; font-weight: 600\">Tipologías<\u002Fspan><span style=\"font-size: 11px; font-weight: 700; color: #0B7F4F; background: #E2F5EA; padding: 2px 8px; border-radius: 999px\">Activo<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 8px 10px; background: #F3F6FB; border-radius: 8px\"><span style=\"color: #0A2463; font-weight: 600\">Velocidad<\u002Fspan><span style=\"font-size: 11px; font-weight: 700; color: #0B7F4F; background: #E2F5EA; padding: 2px 8px; border-radius: 999px\">Activo<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Franja de capacidades -->\n<div style=\"max-width: 1240px; margin: 48px auto 0; background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 16px; box-shadow: 0 6px 20px rgba(10,36,99,0.06); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr))\">\n<div style=\"padding: 26px 22px; text-align: center; border-right: 1px solid #E6ECF5\">\n<svg width=\"36\" height=\"36\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0A2463\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"M20 20l-3.5-3.5\"><\u002Fpath><\u002Fsvg>\n<div style=\"font-weight: 800; color: #1E5BD8; margin-top: 8px\">Detección temprana<\u002Fdiv><div style=\"font-size: 14px; color: #3B4A63\">de operaciones sospechosas.<\u002Fdiv><\u002Fdiv>\n<div style=\"padding: 26px 22px; text-align: center; border-right: 1px solid #E6ECF5\">\n<svg width=\"36\" height=\"36\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0A2463\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"2.5\"><\u002Fcircle><circle cx=\"12\" cy=\"3.5\" r=\"1.5\"><\u002Fcircle><circle cx=\"12\" cy=\"20.5\" r=\"1.5\"><\u002Fcircle><circle cx=\"3.5\" cy=\"12\" r=\"1.5\"><\u002Fcircle><circle cx=\"20.5\" cy=\"12\" r=\"1.5\"><\u002Fcircle><path d=\"M12 5v4.5M12 14.5V19M5 12h4.5M14.5 12H19\"><\u002Fpath><\u002Fsvg>\n<div style=\"font-weight: 800; color: #1E5BD8; margin-top: 8px\">Monitoreo continuo<\u002Fdiv><div style=\"font-size: 14px; color: #3B4A63\">de clientes, transacciones y contrapartes.<\u002Fdiv><\u002Fdiv>\n<div style=\"padding: 26px 22px; text-align: center; border-right: 1px solid #E6ECF5\">\n<svg width=\"36\" height=\"36\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0A2463\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"><\u002Fpath><path d=\"M10 12h5M10 16h5\"><\u002Fpath><\u002Fsvg>\n<div style=\"font-weight: 800; color: #1E5BD8; margin-top: 8px\">Evidencia trazable<\u002Fdiv><div style=\"font-size: 14px; color: #3B4A63\">por transacción, lista para el ROS.<\u002Fdiv><\u002Fdiv>\n<div style=\"padding: 26px 22px; text-align: center\">\n<svg width=\"36\" height=\"36\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0A2463\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6l8-3z\"><\u002Fpath><path d=\"M9 12l2 2 4-4\"><\u002Fpath><\u002Fsvg>\n<div style=\"font-weight: 800; color: #1E5BD8; margin-top: 8px\">Cumplimiento normativo<\u002Fdiv><div style=\"font-size: 14px; color: #3B4A63\">con UAF, GAFI y estándares internacionales.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- PROBLEMA -->\n<section id=\"problema\" style=\"padding: clamp(48px, 6vw, 80px) clamp(16px, 5vw, 64px)\">\n<div style=\"max-width: 1240px; margin: 0 auto\">\n<div style=\"display: flex; align-items: center; gap: 14px\">\n<div style=\"width: 48px; height: 48px; border-radius: 50%; background: #D64545; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2L12 3z\"><\u002Fpath><path d=\"M12 10v5M12 18v.01\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h2 style=\"margin: 0; font-size: clamp(1.6rem, 2.6vw, 2.2rem); font-weight: 800; color: #0A2463; line-height: 1.2\">El crimen organizado ya usa IA para evadir sus reglas<\u002Fh2>\n<\u002Fdiv>\n<p style=\"margin: 16px 0 0; max-width: 860px; font-size: 1.05rem; line-height: 1.8\">Quien lava activos conoce los controles y los umbrales de los sistemas vigentes, y hoy usa inteligencia artificial para crear patrones nuevos que los eluden. Las reglas fijas cubren lo que ya se programó, no lo que aún no se ha visto.<\u002Fp>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; margin-top: 28px\">\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 16px; padding: 24px; display: flex; gap: 16px; align-items: flex-start\">\n<div style=\"width: 44px; height: 44px; border-radius: 50%; background: #1E5BD8; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 10l9-6 9 6M5 10v9M19 10v9M9 10v9M15 10v9M3 21h18\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div><div style=\"font-size: 18px; font-weight: 800; color: #0A2463\">La banca usa IA para detectar<\u002Fdiv><div style=\"font-size: 15px; margin-top: 4px\">Modelos que identifican patrones, anomalías y redes para fortalecer el cumplimiento.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #FFF5F5; border: 1px solid #F3CFCF; border-radius: 16px; padding: 24px; display: flex; gap: 16px; align-items: flex-start\">\n<div style=\"width: 44px; height: 44px; border-radius: 50%; background: #D64545; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z\"><\u002Fpath><path d=\"M3 3l18 18\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div><div style=\"font-size: 18px; font-weight: 800; color: #A12B2B\">El crimen organizado usa IA para evadir<\u002Fdiv><div style=\"font-size: 15px; margin-top: 4px\">Técnicas y patrones nuevos, diseñados específicamente para eludir los controles actuales.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<h3 style=\"margin: 44px 0 16px; font-size: 1.35rem; font-weight: 800; color: #0A2463\">Mientras tanto, su área de cumplimiento paga el costo<\u002Fh3>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px\">\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 16px; padding: 24px; text-align: center\">\n<div style=\"font-size: 2.2rem; font-weight: 800; color: #C23535; line-height: 1\">~90–95%<\u002Fdiv>\n<div style=\"font-weight: 700; color: #0A2463; margin-top: 8px\">Falsos positivos<\u002Fdiv>\n<div style=\"font-size: 14px; margin-top: 6px\">de las alertas de los motores de reglas terminan siendo irrelevantes, según cifras habituales de la industria AML.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 16px; padding: 24px; text-align: center\">\n<div style=\"font-size: 2.2rem; font-weight: 800; color: #C23535; line-height: 1\">La mayoría<\u002Fdiv>\n<div style=\"font-weight: 700; color: #0A2463; margin-top: 8px\">del tiempo del analista<\u002Fdiv>\n<div style=\"font-size: 14px; margin-top: 6px\">se va en cerrar alertas sin sustancia, en vez de investigar los casos que sí importan.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 16px; padding: 24px; text-align: center\">\n<div style=\"font-size: 2.2rem; font-weight: 800; color: #C23535; line-height: 1\">Un solo caso<\u002Fdiv>\n<div style=\"font-weight: 700; color: #0A2463; margin-top: 8px\">no detectado<\u002Fdiv>\n<div style=\"font-size: 14px; margin-top: 6px\">puede derivar en sanciones millonarias y daño reputacional ante el regulador.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px\">\n<span style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 999px; padding: 8px 16px; font-size: 14px\"><strong style=\"color: #0A2463\">Reglas estáticas:<\u002Fstrong> no evolucionan<\u002Fspan>\n<span style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 999px; padding: 8px 16px; font-size: 14px\"><strong style=\"color: #0A2463\">Umbrales fijos:<\u002Fstrong> fáciles de saltar<\u002Fspan>\n<span style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 999px; padding: 8px 16px; font-size: 14px\"><strong style=\"color: #0A2463\">Reactivas:<\u002Fstrong> actúan después del hecho<\u002Fspan>\n<span style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 999px; padding: 8px 16px; font-size: 14px\"><strong style=\"color: #0A2463\">Programación manual:<\u002Fstrong> cada tipología nueva toma meses<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- BENEFICIOS -->\n<section id=\"beneficios\" style=\"padding: clamp(48px, 6vw, 80px) clamp(16px, 5vw, 64px); background: #FFFFFF; border-top: 1px solid #DCE5F2; border-bottom: 1px solid #DCE5F2\">\n<div style=\"max-width: 1240px; margin: 0 auto\">\n<div style=\"display: flex; align-items: center; gap: 14px\">\n<div style=\"width: 48px; height: 48px; border-radius: 50%; background: #1E5BD8; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 3h12l3 6-9 12L3 9l3-6z\"><\u002Fpath><path d=\"M3 9h18M12 21L8 9l4-6 4 6-4 12\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h2 style=\"margin: 0; font-size: clamp(1.6rem, 2.6vw, 2.2rem); font-weight: 800; color: #0A2463; line-height: 1.2\">Beneficios<\u002Fh2>\n<\u002Fdiv>\n<p style=\"margin: 16px 0 0; max-width: 860px; font-size: 1.05rem; line-height: 1.8\">Amlia no es otro sistema más para vigilar. Es un socio que absorbe el ruido, entrega evidencia auditable y le devuelve a su equipo el tiempo para lo que realmente importa.<\u002Fp>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; margin-top: 28px\">\n<div style=\"background: #EAF7EF; border-radius: 16px; padding: 26px; text-align: center\">\n<div style=\"width: 58px; height: 58px; border-radius: 50%; background: #13945B; display: flex; align-items: center; justify-content: center; margin: 0 auto\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"8\" r=\"3\"><\u002Fcircle><path d=\"M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6\"><\u002Fpath><path d=\"M16 5.5a3 3 0 010 5.5M18 14.5c1.8.9 3 2.9 3 5.5\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h3 style=\"margin: 14px 0 6px; font-size: 17px; font-weight: 800; color: #0A2463\">Su equipo vuelve a investigar<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">Cada alerta llega con un score de confianza, para atender primero las relevantes.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #EAF1FD; border-radius: 16px; padding: 26px; text-align: center\">\n<div style=\"width: 58px; height: 58px; border-radius: 50%; background: #1E5BD8; display: flex; align-items: center; justify-content: center; margin: 0 auto\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"5\" cy=\"6\" r=\"2\"><\u002Fcircle><circle cx=\"19\" cy=\"6\" r=\"2\"><\u002Fcircle><circle cx=\"12\" cy=\"18\" r=\"2\"><\u002Fcircle><path d=\"M7 6h10M6 8l5 8M18 8l-5 8\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h3 style=\"margin: 14px 0 6px; font-size: 17px; font-weight: 800; color: #0A2463\">Ve lo que las reglas no ven<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">Patrones de comportamiento, anomalías y redes entre cuentas, invisibles para los umbrales fijos.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #F1EDFC; border-radius: 16px; padding: 26px; text-align: center\">\n<div style=\"width: 58px; height: 58px; border-radius: 50%; background: #6A44D4; display: flex; align-items: center; justify-content: center; margin: 0 auto\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"><\u002Fpath><path d=\"M9.5 14l2 2 3.5-4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h3 style=\"margin: 14px 0 6px; font-size: 17px; font-weight: 800; color: #0A2463\">Cada alerta se puede sustentar<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">Sin cajas negras: transacciones, ventana temporal y explicación de por qué se alertó (SHAP).<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #E6F6F5; border-radius: 16px; padding: 26px; text-align: center\">\n<div style=\"width: 58px; height: 58px; border-radius: 50%; background: #0E8C84; display: flex; align-items: center; justify-content: center; margin: 0 auto\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l9 5-9 5-9-5 9-5z\"><\u002Fpath><path d=\"M3 13l9 5 9-5\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h3 style=\"margin: 14px 0 6px; font-size: 17px; font-weight: 800; color: #0A2463\">Nuevas tipologías sin reprogramar<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">Los motores por tipología amplían la cobertura aprendiendo patrones, sin esperar meses por una regla.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #EAF1FD; border-radius: 16px; padding: 26px; text-align: center\">\n<div style=\"width: 58px; height: 58px; border-radius: 50%; background: #1E5BD8; display: flex; align-items: center; justify-content: center; margin: 0 auto\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1\"><\u002Fpath><path d=\"M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h3 style=\"margin: 14px 0 6px; font-size: 17px; font-weight: 800; color: #0A2463\">No reemplaza lo que ya tiene<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">Se ensambla con su sistema de reglas y lo complementa, sin interrumpir la operación.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #EAF7EF; border-radius: 16px; padding: 26px; text-align: center\">\n<div style=\"width: 58px; height: 58px; border-radius: 50%; background: #13945B; display: flex; align-items: center; justify-content: center; margin: 0 auto\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 20V10M10 20V4M16 20v-7M22 20H2\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h3 style=\"margin: 14px 0 6px; font-size: 17px; font-weight: 800; color: #0A2463\">Crece sin crecer el equipo<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">El servicio escala con su volumen transaccional, sin sumar analistas en la misma proporción.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- A quién está dirigido -->\n<div style=\"display: flex; align-items: center; gap: 14px; margin-top: 52px\">\n<div style=\"width: 44px; height: 44px; border-radius: 50%; background: #1E5BD8; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"7\" r=\"3\"><\u002Fcircle><circle cx=\"5\" cy=\"10\" r=\"2\"><\u002Fcircle><circle cx=\"19\" cy=\"10\" r=\"2\"><\u002Fcircle><path d=\"M7 20c0-2.8 2.2-5 5-5s5 2.2 5 5M1.5 19c0-2 1.5-3.5 3.5-3.5M22.5 19c0-2-1.5-3.5-3.5-3.5\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 1.4rem; font-weight: 800; color: #0A2463\">¿Qué gana cada uno?<\u002Fh3>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; margin-top: 18px\">\n<div style=\"border: 1px solid #DCE5F2; border-radius: 16px; padding: 22px\"><div style=\"font-weight: 800; color: #1E5BD8\">Oficial de cumplimiento<\u002Fdiv><div style=\"font-size: 15px; margin-top: 6px\">Confianza en que ningún caso real se escapa y respaldo auditable frente al regulador.<\u002Fdiv><\u002Fdiv>\n<div style=\"border: 1px solid #DCE5F2; border-radius: 16px; padding: 22px\"><div style=\"font-weight: 800; color: #1E5BD8\">Analistas<\u002Fdiv><div style=\"font-size: 15px; margin-top: 6px\">Menos alertas sin sustancia y mejores insumos para cada investigación. Los potenciamos, no los reemplazamos.<\u002Fdiv><\u002Fdiv>\n<div style=\"border: 1px solid #DCE5F2; border-radius: 16px; padding: 22px\"><div style=\"font-weight: 800; color: #1E5BD8\">Tecnología y riesgo<\u002Fdiv><div style=\"font-size: 15px; margin-top: 6px\">Integración por archivo o API, en la nube, sin modificar los sistemas que el banco ya opera.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- CÓMO FUNCIONA -->\n<section id=\"como-funciona\" style=\"padding: clamp(48px, 6vw, 80px) clamp(16px, 5vw, 64px)\">\n<div style=\"max-width: 1240px; margin: 0 auto\">\n<div style=\"display: flex; align-items: center; gap: 14px\">\n<div style=\"width: 48px; height: 48px; border-radius: 50%; background: #1E5BD8; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><path d=\"M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h2 style=\"margin: 0; font-size: clamp(1.6rem, 2.6vw, 2.2rem); font-weight: 800; color: #0A2463; line-height: 1.2\">Cómo funciona: usted envía movimientos, recibe alertas con evidencia<\u002Fh2>\n<\u002Fdiv>\n<p style=\"margin: 16px 0 0; max-width: 860px; font-size: 1.05rem; line-height: 1.8\">Amlia es un servicio en la nube que trabaja en cinco pasos. La decisión final siempre es de su equipo.<\u002Fp>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 14px; margin-top: 28px\">\n<div>\n<div style=\"height: 56px; background: #DCEBFF; clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 50%, calc(100% - 20px) 100%, 0 100%, 20px 50%); display: flex; align-items: center; justify-content: center\"><span style=\"width: 34px; height: 34px; border-radius: 50%; background: #1E5BD8; color: #FFFFFF; font-weight: 800; display: flex; align-items: center; justify-content: center\">1<\u002Fspan><\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 14px; padding: 18px; margin-top: 10px; text-align: center\">\n<div style=\"font-weight: 800; color: #0A2463\">Envía sus movimientos<\u002Fdiv>\n<div style=\"font-size: 14px; margin-top: 6px\">Por archivo (CSV, JSON, FTP) o por API, cifrados en todo el tránsito.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"height: 56px; background: #D6F2EF; clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 50%, calc(100% - 20px) 100%, 0 100%, 20px 50%); display: flex; align-items: center; justify-content: center\"><span style=\"width: 34px; height: 34px; border-radius: 50%; background: #0E8C84; color: #FFFFFF; font-weight: 800; display: flex; align-items: center; justify-content: center\">2<\u002Fspan><\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 14px; padding: 18px; margin-top: 10px; text-align: center\">\n<div style=\"font-weight: 800; color: #0A2463\">Validamos los datos<\u002Fdiv>\n<div style=\"font-size: 14px; margin-top: 6px\">Se revisa la estructura y se informan los registros válidos y rechazados.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"height: 56px; background: #DDF3E4; clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 50%, calc(100% - 20px) 100%, 0 100%, 20px 50%); display: flex; align-items: center; justify-content: center\"><span style=\"width: 34px; height: 34px; border-radius: 50%; background: #13945B; color: #FFFFFF; font-weight: 800; display: flex; align-items: center; justify-content: center\">3<\u002Fspan><\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 14px; padding: 18px; margin-top: 10px; text-align: center\">\n<div style=\"font-weight: 800; color: #0A2463\">Analizan los motores<\u002Fdiv>\n<div style=\"font-size: 14px; margin-top: 6px\">Cuatro motores de IA buscan patrones de lavado por tipología.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"height: 56px; background: #FDEAD6; clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 50%, calc(100% - 20px) 100%, 0 100%, 20px 50%); display: flex; align-items: center; justify-content: center\"><span style=\"width: 34px; height: 34px; border-radius: 50%; background: #C25F0A; color: #FFFFFF; font-weight: 800; display: flex; align-items: center; justify-content: center\">4<\u002Fspan><\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 14px; padding: 18px; margin-top: 10px; text-align: center\">\n<div style=\"font-weight: 800; color: #0A2463\">Llega la evidencia<\u002Fdiv>\n<div style=\"font-size: 14px; margin-top: 6px\">Cada alerta trae sus transacciones, la ventana temporal y la explicación.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"height: 56px; background: #E9E2FB; clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 50%, calc(100% - 20px) 100%, 0 100%, 20px 50%); display: flex; align-items: center; justify-content: center\"><span style=\"width: 34px; height: 34px; border-radius: 50%; background: #6A44D4; color: #FFFFFF; font-weight: 800; display: flex; align-items: center; justify-content: center\">5<\u002Fspan><\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 14px; padding: 18px; margin-top: 10px; text-align: center\">\n<div style=\"font-weight: 800; color: #0A2463\">Su analista decide<\u002Fdiv>\n<div style=\"font-size: 14px; margin-top: 6px\">Revisa en el backoffice, valida con sus reglas y obtiene el insumo para el ROS.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Cuatro motores -->\n<h3 style=\"margin: 52px 0 18px; font-size: 1.4rem; font-weight: 800; color: #0A2463\">Cuatro motores, cuatro formas de mirar una cuenta<\u002Fh3>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 16px\">\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"display: flex; align-items: center; gap: 12px\"><div style=\"width: 40px; height: 40px; border-radius: 50%; background: #1E5BD8; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 6h16M4 12h10M4 18h6\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font-weight: 800; color: #0A2463\">Secuencias<\u002Fdiv><\u002Fdiv>\n<div style=\"font-size: 15px\">Lee el orden de los movimientos de cada cuenta, como quien lee una historia.<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto\"><span style=\"background: #E3EEFF; color: #1E4FBF; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px\">Smurfing<\u002Fspan><span style=\"background: #E3EEFF; color: #1E4FBF; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px\">Deposit-Send<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"display: flex; align-items: center; gap: 12px\"><div style=\"width: 40px; height: 40px; border-radius: 50%; background: #6A44D4; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"5\" cy=\"6\" r=\"2\"><\u002Fcircle><circle cx=\"19\" cy=\"6\" r=\"2\"><\u002Fcircle><circle cx=\"12\" cy=\"18\" r=\"2\"><\u002Fcircle><path d=\"M7 6h10M6 8l5 8M18 8l-5 8\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font-weight: 800; color: #0A2463\">Redes<\u002Fdiv><\u002Fdiv>\n<div style=\"font-size: 15px\">Mira con quién se relaciona cada cuenta y cómo circula el dinero entre ellas.<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto\"><span style=\"background: #EEE8FC; color: #5233B0; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px\">Las 15 tipologías<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"display: flex; align-items: center; gap: 12px\"><div style=\"width: 40px; height: 40px; border-radius: 50%; background: #0E8C84; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l9 5-9 5-9-5 9-5z\"><\u002Fpath><path d=\"M3 13l9 5 9-5\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font-weight: 800; color: #0A2463\">Tipologías<\u002Fdiv><\u002Fdiv>\n<div style=\"font-size: 15px\">Un modelo especialista por cada tipología de lavado.<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto\"><span style=\"background: #DFF3F1; color: #0B6E68; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px\">Structuring<\u002Fspan><span style=\"background: #DFF3F1; color: #0B6E68; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px\">Cycle<\u002Fspan><span style=\"background: #DFF3F1; color: #0B6E68; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px\">Fan patterns<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"display: flex; align-items: center; gap: 12px\"><div style=\"width: 40px; height: 40px; border-radius: 50%; background: #C25F0A; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"13\" r=\"8\"><\u002Fcircle><path d=\"M12 9v4l3 2M9 2h6\"><\u002Fpath><\u002Fsvg><\u002Fdiv><div style=\"font-weight: 800; color: #0A2463\">Velocidad<\u002Fdiv><\u002Fdiv>\n<div style=\"font-size: 15px\">Mide el ritmo y la concentración de operaciones en ventanas de tiempo.<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto\"><span style=\"background: #FCEBDA; color: #9A4A06; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px\">Structuring<\u002Fspan><span style=\"background: #FCEBDA; color: #9A4A06; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px\">Smurfing<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 16px 0 0; font-size: 15px\">Una cuenta se alerta cuando cualquiera de los cuatro motores la detecta. Lo que a uno se le escapa, lo ve otro.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ARQUITECTURA -->\n<section id=\"arquitectura\" style=\"padding: clamp(48px, 6vw, 80px) clamp(16px, 5vw, 64px); background: #FFFFFF; border-top: 1px solid #DCE5F2; border-bottom: 1px solid #DCE5F2\">\n<div style=\"max-width: 1240px; margin: 0 auto\">\n<div style=\"display: flex; align-items: center; gap: 14px\">\n<div style=\"width: 48px; height: 48px; border-radius: 50%; background: #1E5BD8; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"5\" cy=\"18\" r=\"2\"><\u002Fcircle><circle cx=\"12\" cy=\"6\" r=\"2\"><\u002Fcircle><circle cx=\"19\" cy=\"18\" r=\"2\"><\u002Fcircle><path d=\"M6.2 16.4l4.6-8.8M13.2 7.6l4.6 8.8M7 18h10\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h2 style=\"margin: 0; font-size: clamp(1.6rem, 2.6vw, 2.2rem); font-weight: 800; color: #0A2463; line-height: 1.2\">Arquitectura e integración<\u002Fh2>\n<\u002Fdiv>\n<p style=\"margin: 16px 0 0; max-width: 860px; font-size: 1.05rem; line-height: 1.8\">Sus datos entran por archivo o API, pasan por los motores de Amlia y vuelven a sus sistemas como alertas con evidencia.<\u002Fp>\n\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 14px; margin-top: 28px\">\n<div style=\"flex: 1 1 260px; min-width: 0; background: #F3F6FB; border: 1px solid #DCE5F2; border-radius: 16px; padding: 18px\">\n<div style=\"font-weight: 800; color: #0A2463; text-align: center; margin-bottom: 12px\">Fuentes de datos<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 10px; padding: 10px 14px; font-size: 14px\">Transacciones<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 10px; padding: 10px 14px; font-size: 14px\">Clientes (KYC)<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 10px; padding: 10px 14px; font-size: 14px\">Cuentas y contrapartes<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 10px; padding: 10px 14px; font-size: 14px\">Canales digitales<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 10px; padding: 10px 14px; font-size: 14px\">Listas y PEP<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<svg class=\"flow-arrow\" width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1E5BD8\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 12h15M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n<div style=\"flex: 1 1 260px; min-width: 0; background: #EAF1FD; border: 1.5px solid #9DBBF0; border-radius: 16px; padding: 18px\">\n<div style=\"font-weight: 800; color: #1E4FBF; text-align: center; margin-bottom: 12px\">Plataforma Amlia<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<div style=\"background: #FFFFFF; border: 1px solid #C3D5F5; border-radius: 10px; padding: 10px 14px; font-size: 14px; color: #0A2463; font-weight: 600\">Validación de datos<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #C3D5F5; border-radius: 10px; padding: 10px 14px; font-size: 14px; color: #0A2463; font-weight: 600\">4 motores de IA<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #C3D5F5; border-radius: 10px; padding: 10px 14px; font-size: 14px; color: #0A2463; font-weight: 600\">Score de confianza por alerta<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #C3D5F5; border-radius: 10px; padding: 10px 14px; font-size: 14px; color: #0A2463; font-weight: 600\">Evidencia y explicabilidad (SHAP)<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #C3D5F5; border-radius: 10px; padding: 10px 14px; font-size: 14px; color: #0A2463; font-weight: 600\">MLOps y monitoreo de modelos<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<svg class=\"flow-arrow\" width=\"40\" height=\"40\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1E5BD8\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 12h15M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg>\n<div style=\"flex: 1 1 260px; min-width: 0; background: #F3F6FB; border: 1px solid #DCE5F2; border-radius: 16px; padding: 18px\">\n<div style=\"font-weight: 800; color: #0A2463; text-align: center; margin-bottom: 12px\">Integración con el banco<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 10px; padding: 10px 14px; font-size: 14px\">Su motor de reglas<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 10px; padding: 10px 14px; font-size: 14px\">Backoffice de analistas<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 10px; padding: 10px 14px; font-size: 14px\">Insumo para ROS a la UAF<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 10px; padding: 10px 14px; font-size: 14px\">Registros de auditoría<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 10px; padding: 10px 14px; font-size: 14px\">API / archivo (CSV, JSON, FTP)<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- RESULTADOS -->\n<section id=\"resultados\" style=\"padding: clamp(48px, 6vw, 80px) clamp(16px, 5vw, 64px)\">\n<div style=\"max-width: 1240px; margin: 0 auto\">\n<div style=\"display: flex; align-items: center; gap: 14px\">\n<div style=\"width: 48px; height: 48px; border-radius: 50%; background: #1E5BD8; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 20V10M10 20V4M16 20v-7M22 20H2\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h2 style=\"margin: 0; font-size: clamp(1.6rem, 2.6vw, 2.2rem); font-weight: 800; color: #0A2463; line-height: 1.2\">Indicadores de la prueba<\u002Fh2>\n<\u002Fdiv>\n<p style=\"margin: 16px 0 0; max-width: 860px; font-size: 1.05rem; line-height: 1.8\">Evaluamos los cuatro motores combinados sobre el conjunto de prueba de SAML-D, un dataset sintético de lavado de activos.<\u002Fp>\n\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 16px; margin-top: 28px\">\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 16px; padding: 24px; text-align: center; box-shadow: 0 6px 20px rgba(10,36,99,0.05)\">\n<svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#13945B\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 20V5M6 11l6-6 6 6\"><\u002Fpath><\u002Fsvg>\n<div style=\"font-size: 2.6rem; font-weight: 800; color: #0B7F4F; line-height: 1.1\">98,4%<\u002Fdiv>\n<div style=\"font-weight: 700; color: #0A2463\">Recall<\u002Fdiv>\n<div style=\"font-size: 14px; margin-top: 4px\">de las cuentas de lavado fueron detectadas.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 16px; padding: 24px; text-align: center; box-shadow: 0 6px 20px rgba(10,36,99,0.05)\">\n<svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1E5BD8\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><\u002Fsvg>\n<div style=\"font-size: 2.6rem; font-weight: 800; color: #1E5BD8; line-height: 1.1\">3,00%<\u002Fdiv>\n<div style=\"font-weight: 700; color: #0A2463\">Falsos positivos<\u002Fdiv>\n<div style=\"font-size: 14px; margin-top: 4px\">de las cuentas normales recibieron una alerta.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 16px; padding: 24px; text-align: center; box-shadow: 0 6px 20px rgba(10,36,99,0.05)\">\n<svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#6A44D4\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"8\" r=\"3\"><\u002Fcircle><path d=\"M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6\"><\u002Fpath><path d=\"M16 5.5a3 3 0 010 5.5M18 14.5c1.8.9 3 2.9 3 5.5\"><\u002Fpath><\u002Fsvg>\n<div style=\"font-size: 2.6rem; font-weight: 800; color: #0A2463; line-height: 1.1\">101.169<\u002Fdiv>\n<div style=\"font-weight: 700; color: #0A2463\">Cuentas evaluadas<\u002Fdiv>\n<div style=\"font-size: 14px; margin-top: 4px\">en el conjunto de prueba.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 16px; padding: 24px; text-align: center; box-shadow: 0 6px 20px rgba(10,36,99,0.05)\">\n<svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0E8C84\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"><\u002Fpath><path d=\"M10 12h5M10 16h5\"><\u002Fpath><\u002Fsvg>\n<div style=\"font-size: 2.6rem; font-weight: 800; color: #0A2463; line-height: 1.1\">1.425.617<\u002Fdiv>\n<div style=\"font-weight: 700; color: #0A2463\">Transacciones<\u002Fdiv>\n<div style=\"font-size: 14px; margin-top: 4px\">analizadas por los motores.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 16px; padding: 22px; margin-top: 20px\">\n<div style=\"font-weight: 800; color: #0A2463; margin-bottom: 12px\">15 tipologías cubiertas<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<span style=\"background: #F3F6FB; border: 1px solid #DCE5F2; border-radius: 999px; padding: 6px 14px; font-size: 13px; color: #0A2463\">Bipartite<\u002Fspan>\n<span style=\"background: #F3F6FB; border: 1px solid #DCE5F2; border-radius: 999px; padding: 6px 14px; font-size: 13px; color: #0A2463\">Over-Invoicing<\u002Fspan>\n<span style=\"background: #F3F6FB; border: 1px solid #DCE5F2; border-radius: 999px; padding: 6px 14px; font-size: 13px; color: #0A2463\">Cash Withdrawal<\u002Fspan>\n<span style=\"background: #F3F6FB; border: 1px solid #DCE5F2; border-radius: 999px; padding: 6px 14px; font-size: 13px; color: #0A2463\">Smurfing<\u002Fspan>\n<span style=\"background: #F3F6FB; border: 1px solid #DCE5F2; border-radius: 999px; padding: 6px 14px; font-size: 13px; color: #0A2463\">Cycle<\u002Fspan>\n<span style=\"background: #F3F6FB; border: 1px solid #DCE5F2; border-radius: 999px; padding: 6px 14px; font-size: 13px; color: #0A2463\">Stacked Bipartite<\u002Fspan>\n<span style=\"background: #F3F6FB; border: 1px solid #DCE5F2; border-radius: 999px; padding: 6px 14px; font-size: 13px; color: #0A2463\">Layered Fan-Out<\u002Fspan>\n<span style=\"background: #F3F6FB; border: 1px solid #DCE5F2; border-radius: 999px; padding: 6px 14px; font-size: 13px; color: #0A2463\">Deposit-Send<\u002Fspan>\n<span style=\"background: #F3F6FB; border: 1px solid #DCE5F2; border-radius: 999px; padding: 6px 14px; font-size: 13px; color: #0A2463\">Scatter-Gather<\u002Fspan>\n<span style=\"background: #F3F6FB; border: 1px solid #DCE5F2; border-radius: 999px; padding: 6px 14px; font-size: 13px; color: #0A2463\">Structuring<\u002Fspan>\n<span style=\"background: #F3F6FB; border: 1px solid #DCE5F2; border-radius: 999px; padding: 6px 14px; font-size: 13px; color: #0A2463\">Layered Fan-In<\u002Fspan>\n<span style=\"background: #F3F6FB; border: 1px solid #DCE5F2; border-radius: 999px; padding: 6px 14px; font-size: 13px; color: #0A2463\">Fan-Out<\u002Fspan>\n<span style=\"background: #F3F6FB; border: 1px solid #DCE5F2; border-radius: 999px; padding: 6px 14px; font-size: 13px; color: #0A2463\">Gather-Scatter<\u002Fspan>\n<span style=\"background: #F3F6FB; border: 1px solid #DCE5F2; border-radius: 999px; padding: 6px 14px; font-size: 13px; color: #0A2463\">Fan-In<\u002Fspan>\n<span style=\"background: #F3F6FB; border: 1px solid #DCE5F2; border-radius: 999px; padding: 6px 14px; font-size: 13px; color: #0A2463\">Single Large<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 16px 0 0; max-width: 860px; font-size: 14px; color: #5A6880\">Resultados obtenidos con datos sintéticos. Demuestran la viabilidad del enfoque y no certifican el desempeño en producción, que depende de los datos de cada institución.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- SEGURIDAD -->\n<section id=\"seguridad\" style=\"padding: clamp(48px, 6vw, 80px) clamp(16px, 5vw, 64px); background: #FFFFFF; border-top: 1px solid #DCE5F2; border-bottom: 1px solid #DCE5F2\">\n<div style=\"max-width: 1240px; margin: 0 auto\">\n<div style=\"display: flex; align-items: center; gap: 14px\">\n<div style=\"width: 48px; height: 48px; border-radius: 50%; background: #1E5BD8; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"10\" rx=\"2\"><\u002Frect><path d=\"M8 11V7a4 4 0 018 0v4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h2 style=\"margin: 0; font-size: clamp(1.6rem, 2.6vw, 2.2rem); font-weight: 800; color: #0A2463; line-height: 1.2\">Seguridad y auditoría, pensadas para el regulador<\u002Fh2>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 14px; margin-top: 28px\">\n<div style=\"display: flex; gap: 14px; align-items: flex-start; background: #F3F6FB; border-radius: 14px; padding: 18px\"><div style=\"width: 12px; height: 12px; border-radius: 50%; background: #0E8C84; margin-top: 6px; flex-shrink: 0\"><\u002Fdiv><div><div style=\"font-weight: 800; color: #0A2463\">Carga y descarga segura<\u002Fdiv><div style=\"font-size: 14px\">Cifrado AES-256 y TLS 1.3 en todo el tránsito.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; gap: 14px; align-items: flex-start; background: #F3F6FB; border-radius: 14px; padding: 18px\"><div style=\"width: 12px; height: 12px; border-radius: 50%; background: #0E8C84; margin-top: 6px; flex-shrink: 0\"><\u002Fdiv><div><div style=\"font-weight: 800; color: #0A2463\">Hash de integridad<\u002Fdiv><div style=\"font-size: 14px\">Ningún archivo se altera entre el envío y la recepción.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; gap: 14px; align-items: flex-start; background: #F3F6FB; border-radius: 14px; padding: 18px\"><div style=\"width: 12px; height: 12px; border-radius: 50%; background: #0E8C84; margin-top: 6px; flex-shrink: 0\"><\u002Fdiv><div><div style=\"font-weight: 800; color: #0A2463\">Resguardo de identidad<\u002Fdiv><div style=\"font-size: 14px\">Protección de los datos de sus clientes en cada etapa.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; gap: 14px; align-items: flex-start; background: #F3F6FB; border-radius: 14px; padding: 18px\"><div style=\"width: 12px; height: 12px; border-radius: 50%; background: #0E8C84; margin-top: 6px; flex-shrink: 0\"><\u002Fdiv><div><div style=\"font-weight: 800; color: #0A2463\">Accesos controlados<\u002Fdiv><div style=\"font-size: 14px\">Perfiles separados según rol y nivel de autorización.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; gap: 14px; align-items: flex-start; background: #F3F6FB; border-radius: 14px; padding: 18px\"><div style=\"width: 12px; height: 12px; border-radius: 50%; background: #0E8C84; margin-top: 6px; flex-shrink: 0\"><\u002Fdiv><div><div style=\"font-weight: 800; color: #0A2463\">Registros para auditoría<\u002Fdiv><div style=\"font-size: 14px\">Trazabilidad completa, desde la carga hasta la alerta.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; gap: 14px; align-items: flex-start; background: #F3F6FB; border-radius: 14px; padding: 18px\"><div style=\"width: 12px; height: 12px; border-radius: 50%; background: #0E8C84; margin-top: 6px; flex-shrink: 0\"><\u002Fdiv><div><div style=\"font-weight: 800; color: #0A2463\">Logs y bitácora<\u002Fdiv><div style=\"font-size: 14px\">Registro permanente de eventos y accesos al sistema.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display: flex; gap: 14px; align-items: flex-start; background: #F3F6FB; border-radius: 14px; padding: 18px\"><div style=\"width: 12px; height: 12px; border-radius: 50%; background: #0E8C84; margin-top: 6px; flex-shrink: 0\"><\u002Fdiv><div><div style=\"font-weight:
