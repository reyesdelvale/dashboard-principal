<body>
  <div id="__bundler_placeholder">Loading Asesoría IDA...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

e><path d=\"M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6\"><\u002Fpath><path d=\"M16 5.5a3 3 0 010 5.5M18 14.5c1.8.9 3 2.9 3 5.5\"><\u002Fpath><\u002Fsvg>Gobernanza humana<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- HERO -->\n<section id=\"inicio\" style=\"padding: clamp(48px, 6vw, 88px) clamp(16px, 5vw, 64px) 40px\">\n<div style=\"max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 48px 56px\">\n<div style=\"flex: 1 1 460px; min-width: 0\">\n<div style=\"display: inline-flex; align-items: center; gap: 10px; background: #E3EEFF; color: #1E4FBF; font-size: 13px; font-weight: 700; padding: 8px 14px; border-radius: 999px\">\n<span style=\"width: 8px; height: 8px; border-radius: 50%; background: #0FA39A\"><\u002Fspan>Asesoría de implementación · Ingeniería del Desarrollo Agéntico<\u002Fdiv>\n<h1 style=\"margin: 20px 0 0; font-size: clamp(2.3rem, 4.6vw, 3.6rem); font-weight: 800; line-height: 1.08; color: #0A2463; letter-spacing: -0.02em\">Tu equipo ya tiene agentes. Lo que falta es el <span style=\"color: #1E5BD8\">sistema para gobernarlos<\u002Fspan>.<\u002Fh1>\n<div style=\"width: 64px; height: 4px; background: #0FA39A; border-radius: 4px; margin: 24px 0\"><\u002Fdiv>\n<p style=\"margin: 0; max-width: 580px; font-size: 1.1rem; line-height: 1.75\">Acompañamos a tu equipo a implementar el framework de desarrollo agéntico de punta a punta: partimos con un diagnóstico, gestión del cambio y talleres con tu organización, y llegamos a un ambiente funcionando, un piloto real y un equipo capaz de sostenerlo solo.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px\">\n<a href=\"#contacto\" style=\"display: inline-flex; align-items: center; min-height: 52px; padding: 0 26px; background: #1E5BD8; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 700; border-radius: 12px\">Agendar un diagnóstico<\u002Fa>\n<a href=\"#proceso\" style=\"display: inline-flex; align-items: center; min-height: 52px; padding: 0 26px; background: #FFFFFF; border: 1.5px solid #B9CBEA; color: #0A2463; text-decoration: none; font-size: 15px; font-weight: 700; border-radius: 12px\">Ver cómo trabajamos<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Cadena -->\n<div style=\"flex: 1 1 420px; min-width: 0\">\n<div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 14px\">\n<div style=\"width: 40px; height: 40px; border-radius: 50%; background: #1E5BD8; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1\"><\u002Fpath><path d=\"M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div style=\"font-size: 20px; font-weight: 800; color: #0A2463\">La cadena que gobernamos<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 16px; padding: 20px; box-shadow: 0 12px 32px rgba(10,36,99,0.10); display: flex; flex-direction: column; gap: 6px\" role=\"img\" aria-label=\"Cadena causal: Intención, Especificación, Contexto, Verificación, Gobernanza\">\n<div style=\"display: flex; align-items: center; gap: 14px; padding: 12px 14px; background: #F3F6FB; border-radius: 10px\"><span style=\"width: 30px; height: 30px; border-radius: 50%; background: #0A2463; color: #FFFFFF; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0\">1<\u002Fspan><span style=\"flex: 1; font-weight: 700; color: #0A2463\">Intención<\u002Fspan><span style=\"font-size: 12px; font-weight: 700; color: #1E4FBF; background: #E3EEFF; padding: 3px 10px; border-radius: 999px\">Acta<\u002Fspan><\u002Fdiv>\n<div style=\"padding-left: 22px; color: #0FA39A; font-weight: 800; line-height: 1\" aria-hidden=\"true\">↓<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 14px; padding: 12px 14px; background: #F3F6FB; border-radius: 10px\"><span style=\"width: 30px; height: 30px; border-radius: 50%; background: #0A2463; color: #FFFFFF; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0\">2<\u002Fspan><span style=\"flex: 1; font-weight: 700; color: #0A2463\">Especificación<\u002Fspan><span style=\"font-size: 12px; font-weight: 700; color: #1E4FBF; background: #E3EEFF; padding: 3px 10px; border-radius: 999px\">Especificación<\u002Fspan><\u002Fdiv>\n<div style=\"padding-left: 22px; color: #0FA39A; font-weight: 800; line-height: 1\" aria-hidden=\"true\">↓<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 14px; padding: 12px 14px; background: #F3F6FB; border-radius: 10px\"><span style=\"width: 30px; height: 30px; border-radius: 50%; background: #0A2463; color: #FFFFFF; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0\">3<\u002Fspan><span style=\"flex: 1; font-weight: 700; color: #0A2463\">Contexto<\u002Fspan><span style=\"font-size: 12px; font-weight: 700; color: #1E4FBF; background: #E3EEFF; padding: 3px 10px; border-radius: 999px\">Registro<\u002Fspan><\u002Fdiv>\n<div style=\"padding-left: 22px; color: #0FA39A; font-weight: 800; line-height: 1\" aria-hidden=\"true\">↓<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 14px; padding: 12px 14px; background: #F3F6FB; border-radius: 10px\"><span style=\"width: 30px; height: 30px; border-radius: 50%; background: #0A2463; color: #FFFFFF; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0\">4<\u002Fspan><span style=\"flex: 1; font-weight: 700; color: #0A2463\">Verificación<\u002Fspan><span style=\"font-size: 12px; font-weight: 700; color: #1E4FBF; background: #E3EEFF; padding: 3px 10px; border-radius: 999px\">Control<\u002Fspan><\u002Fdiv>\n<div style=\"padding-left: 22px; color: #0FA39A; font-weight: 800; line-height: 1\" aria-hidden=\"true\">↓<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 14px; padding: 12px 14px; background: #E6F6F4; border: 1px solid #A9DDD7; border-radius: 10px\"><span style=\"width: 30px; height: 30px; border-radius: 50%; background: #0FA39A; color: #FFFFFF; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0\">5<\u002Fspan><span style=\"flex: 1; font-weight: 700; color: #0A2463\">Gobernanza<\u002Fspan><span style=\"font-size: 12px; font-weight: 700; color: #0B6E68; background: #FFFFFF; padding: 3px 10px; border-radius: 999px\">Mapa<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Franja de capacidades -->\n<div style=\"max-width: 1240px; margin: 48px auto 0; background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 16px; box-shadow: 0 6px 20px rgba(10,36,99,0.06); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr))\">\n<div style=\"padding: 26px 22px; text-align: center; border-right: 1px solid #E6ECF5\">\n<svg width=\"36\" height=\"36\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0A2463\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"M20 20l-3.5-3.5\"><\u002Fpath><\u002Fsvg>\n<div style=\"font-weight: 800; color: #1E5BD8; margin-top: 8px\">Diagnóstico y cambio<\u002Fdiv><div style=\"font-size: 14px\">con talleres para tu organización.<\u002Fdiv><\u002Fdiv>\n<div style=\"padding: 26px 22px; text-align: center; border-right: 1px solid #E6ECF5\">\n<svg width=\"36\" height=\"36\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0A2463\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><\u002Fsvg>\n<div style=\"font-weight: 800; color: #1E5BD8; margin-top: 8px\">Diseño a medida<\u002Fdiv><div style=\"font-size: 14px\">del sistema IDA en tu organización.<\u002Fdiv><\u002Fdiv>\n<div style=\"padding: 26px 22px; text-align: center; border-right: 1px solid #E6ECF5\">\n<svg width=\"36\" height=\"36\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0A2463\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 9l-4 3 4 3M16 9l4 3-4 3M13 6l-2 12\"><\u002Fpath><\u002Fsvg>\n<div style=\"font-weight: 800; color: #1E5BD8; margin-top: 8px\">Ambiente listo<\u002Fdiv><div style=\"font-size: 14px\">instrucciones, habilidades, arnés y memoria.<\u002Fdiv><\u002Fdiv>\n<div style=\"padding: 26px 22px; text-align: center\">\n<svg width=\"36\" height=\"36\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0A2463\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 19c4-1 6-3 7-7 1 4 3 6 7 7\"><\u002Fpath><path d=\"M12 12V3M8 7l4-4 4 4\"><\u002Fpath><\u002Fsvg>\n<div style=\"font-weight: 800; color: #1E5BD8; margin-top: 8px\">Piloto real<\u002Fdiv><div style=\"font-size: 14px\">de la intención al despliegue.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- PROBLEMA -->\n<section style=\"padding: clamp(48px, 6vw, 80px) clamp(16px, 5vw, 64px)\">\n<div style=\"max-width: 1240px; margin: 0 auto\">\n<div style=\"display: flex; align-items: center; gap: 14px\">\n<div style=\"width: 48px; height: 48px; border-radius: 50%; background: #D64545; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l10 18H2L12 3z\"><\u002Fpath><path d=\"M12 10v5M12 18v.01\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h2 style=\"margin: 0; font-size: clamp(1.6rem, 2.6vw, 2.2rem); font-weight: 800; color: #0A2463; line-height: 1.2\">El cuello de botella cambió de lugar<\u002Fh2>\n<\u002Fdiv>\n<p style=\"margin: 16px 0 0; max-width: 860px; font-size: 1.05rem; line-height: 1.8\">Durante 25 años el límite fue la capacidad humana de escribir código, y Scrum se diseñó para gestionar esa escasez. Con agentes que persiguen objetivos, el código abunda. Scrum no falla: deja de apuntar al problema. Si tu equipo genera más código que nunca pero no confía en lo que llega a producción, este es el diagnóstico.<\u002Fp>\n<div style=\"margin-top: 28px; background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 16px; overflow-x: auto\">\n<sc-raw-table style=\"width: 100%; min-width: 480px; border-collapse: collapse; font-size: 16px\">\n<sc-raw-thead>\n<sc-raw-tr style=\"background: #0A2463\">\n<sc-raw-th scope=\"col\" style=\"text-align: left; padding: 16px 22px; color: #B8C6E0; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase\">Antes<\u002Fsc-raw-th>\n<sc-raw-th scope=\"col\" style=\"text-align: left; padding: 16px 22px; color: #FFFFFF; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase\">Ahora<\u002Fsc-raw-th>\n<\u002Fsc-raw-tr>\n<\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td style=\"padding: 16px 22px; border-bottom: 1px solid #E6ECF5\">Escasez de código<\u002Fsc-raw-td><sc-raw-td style=\"padding: 16px 22px; border-bottom: 1px solid #E6ECF5; font-weight: 700; color: #0A2463\">Abundancia de código<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding: 16px 22px; border-bottom: 1px solid #E6ECF5\">El costo era escribir<\u002Fsc-raw-td><sc-raw-td style=\"padding: 16px 22px; border-bottom: 1px solid #E6ECF5; font-weight: 700; color: #0A2463\">El costo es decidir<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding: 16px 22px; border-bottom: 1px solid #E6ECF5\">El problema era construir<\u002Fsc-raw-td><sc-raw-td style=\"padding: 16px 22px; border-bottom: 1px solid #E6ECF5; font-weight: 700; color: #0A2463\">El problema es saber qué construir<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding: 16px 22px; border-bottom: 1px solid #E6ECF5\">El problema era programar<\u002Fsc-raw-td><sc-raw-td style=\"padding: 16px 22px; border-bottom: 1px solid #E6ECF5; font-weight: 700; color: #0A2463\">El problema es especificar<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td style=\"padding: 16px 22px\">El problema era implementar<\u002Fsc-raw-td><sc-raw-td style=\"padding: 16px 22px; font-weight: 700; color: #0A2463\">El problema es verificar<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- MARCO -->\n<section id=\"marco\" style=\"padding: clamp(48px, 6vw, 80px) clamp(16px, 5vw, 64px); background: #FFFFFF; border-top: 1px solid #DCE5F2; border-bottom: 1px solid #DCE5F2\">\n<div style=\"max-width: 1240px; margin: 0 auto\">\n<div style=\"display: flex; align-items: center; gap: 14px\">\n<div style=\"width: 48px; height: 48px; border-radius: 50%; background: #1E5BD8; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><\u002Fsvg><\u002Fdiv>\n<h2 style=\"margin: 0; font-size: clamp(1.6rem, 2.6vw, 2.2rem); font-weight: 800; color: #0A2463; line-height: 1.2\">El marco: cinco eslabones, cinco artefactos<\u002Fh2>\n<\u002Fdiv>\n<p style=\"margin: 16px 0 0; max-width: 860px; font-size: 1.05rem; line-height: 1.8\">La Ingeniería del Desarrollo Agéntico (IDA) no es filosofía: cada cuello de botella tiene un artefacto concreto, con dueño, que tu equipo aprende a construir y mantener. Cada eslabón roto contamina a los siguientes.<\u002Fp>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 16px; margin-top: 28px\">\n<article style=\"background: #F3F6FB; border: 1px solid #DCE5F2; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"width: 44px; height: 44px; border-radius: 50%; background: #0A2463; display: flex; align-items: center; justify-content: center\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n<span style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #0B6E68\">01 · INTENCIÓN<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 18px; font-weight: 800; color: #0A2463\">Acta de Intención <span style=\"font-weight: 600; color: #5A6880\">(Charter)<\u002Fspan><\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">Qué problema real se resuelve, para quién y por qué esto y no otra prioridad. Validado por negocio.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: #F3F6FB; border: 1px solid #DCE5F2; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"width: 44px; height: 44px; border-radius: 50%; background: #0A2463; display: flex; align-items: center; justify-content: center\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M7 3h7l4 4v14H7z\"><\u002Fpath><path d=\"M10 12h5M10 16h5\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<span style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #0B6E68\">02 · ESPECIFICACIÓN<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 18px; font-weight: 800; color: #0A2463\">Especificación Ejecutable<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">La intención traducida a criterios de aceptación que un agente puede verificar. El desarrollo guiado por especificaciones (SDD) como base.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: #F3F6FB; border: 1px solid #DCE5F2; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"width: 44px; height: 44px; border-radius: 50%; background: #0A2463; display: flex; align-items: center; justify-content: center\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><ellipse cx=\"12\" cy=\"6\" rx=\"8\" ry=\"3\"><\u002Fellipse><path d=\"M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6\"><\u002Fpath><path d=\"M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<span style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #0B6E68\">03 · CONTEXTO<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 18px; font-weight: 800; color: #0A2463\">Registro de Contexto <span style=\"font-weight: 600; color: #5A6880\">(Ledger)<\u002Fspan><\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">Memoria viva: arquitectura, convenciones, decisiones y glosario. Versionado como infraestructura, no como wiki muerta.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: #F3F6FB; border: 1px solid #DCE5F2; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"width: 44px; height: 44px; border-radius: 50%; background: #0A2463; display: flex; align-items: center; justify-content: center\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6l8-3z\"><\u002Fpath><path d=\"M9 12l2 2 4-4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<span style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #0B6E68\">04 · VERIFICACIÓN<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 18px; font-weight: 800; color: #0A2463\">Control de Confianza <span style=\"font-weight: 600; color: #5A6880\">(Gate)<\u002Fspan><\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">Pruebas, revisiones y umbrales que todo lo generado debe pasar antes de tocar producción.<\u002Fp>\n<\u002Farticle>\n<article style=\"background: #E6F6F4; border: 1px solid #A9DDD7; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"width: 44px; height: 44px; border-radius: 50%; background: #0FA39A; display: flex; align-items: center; justify-content: center\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"8\" r=\"3\"><\u002Fcircle><path d=\"M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6\"><\u002Fpath><path d=\"M16 5.5a3 3 0 010 5.5M18 14.5c1.8.9 3 2.9 3 5.5\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<span style=\"font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #0B6E68\">05 · GOBERNANZA<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 18px; font-weight: 800; color: #0A2463\">Mapa de Decisión<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">Quién aprueba qué, quién responde si algo falla y qué puede decidir un agente solo según su nivel de autonomía.<\u002Fp>\n<\u002Farticle>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; margin-top: 16px\">\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 16px; padding: 24px; display: flex; gap: 16px; align-items: flex-start\">\n<div style=\"width: 44px; height: 44px; border-radius: 50%; background: #1E5BD8; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"><\u002Frect><path d=\"M3 10h18M8 3v4M16 3v4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div><div style=\"font-size: 17px; font-weight: 800; color: #0A2463\">Eventos que reemplazan las ceremonias<\u002Fdiv><div style=\"font-size: 15px; margin-top: 4px\">Encuadre de la intención · Sincronización de verificación · Revisión del aprendizaje · Revisión de gobernanza<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 16px; padding: 24px; display: flex; gap: 16px; align-items: flex-start\">\n<div style=\"width: 44px; height: 44px; border-radius: 50%; background: #1E5BD8; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 20V10M10 20V4M16 20v-7M22 20H2\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div><div style=\"font-size: 17px; font-weight: 800; color: #0A2463\">Métricas que reemplazan la velocidad del sprint<\u002Fdiv><div style=\"font-size: 15px; margin-top: 4px\">Tiempo de intención a valor verificado · Tasa de confianza del agente · Frescura del contexto<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- SERVICIO -->\n<section id=\"servicio\" style=\"padding: clamp(48px, 6vw, 80px) clamp(16px, 5vw, 64px)\">\n<div style=\"max-width: 1240px; margin: 0 auto\">\n<div style=\"display: flex; align-items: center; gap: 14px\">\n<div style=\"width: 48px; height: 48px; border-radius: 50%; background: #0FA39A; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h2 style=\"margin: 0; font-size: clamp(1.6rem, 2.6vw, 2.2rem); font-weight: 800; color: #0A2463; line-height: 1.2\">Qué incluye la asesoría<\u002Fh2>\n<\u002Fdiv>\n<p style=\"margin: 16px 0 0; max-width: 860px; font-size: 1.05rem; line-height: 1.8\">No te dejamos un PDF. Te dejamos el sistema funcionando y a las personas preparadas para sostenerlo. La asesoría parte por la organización y luego baja a la ingeniería.<\u002Fp>\n\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 36px\">\n<span style=\"font-size: 13px; font-weight: 700; color: #FFFFFF; background: #0FA39A; padding: 6px 14px; border-radius: 999px\">Etapa 1 · Inicio<\u002Fspan>\n<span style=\"font-size: 16px; font-weight: 700; color: #0A2463\">Diagnóstico, proceso base, gestión del cambio y talleres<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 16px; margin-top: 16px\">\n<article style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"width: 48px; height: 48px; border-radius: 50%; background: #0FA39A; display: flex; align-items: center; justify-content: center\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"M20 20l-3.5-3.5\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 19px; font-weight: 800; color: #0A2463\">Diagnóstico organizacional y técnico<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">Ubicamos a tu organización en la escala de madurez e identificamos en qué eslabón se rompe hoy el flujo, en las personas y en la tecnología.<\u002Fp>\n<ul style=\"margin: 0; padding-left: 18px; font-size: 15px; display: flex; flex-direction: column; gap: 4px\">\n<li>Entrevistas con negocio, arquitectura y desarrollo<\u002Fli>\n<li>Revisión de repositorios, flujo de integración y uso actual de agentes<\u002Fli>\n<li>Lectura de cultura, roles y disposición al cambio<\u002Fli>\n<li>Mapa de brechas por eslabón y prioridades<\u002Fli>\n<\u002Ful>\n<\u002Farticle>\n<article style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"width: 48px; height: 48px; border-radius: 50%; background: #0FA39A; display: flex; align-items: center; justify-content: center\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"2\" y=\"9\" width=\"6\" height=\"6\" rx=\"1.2\"><\u002Frect><rect x=\"16\" y=\"3\" width=\"6\" height=\"6\" rx=\"1.2\"><\u002Frect><rect x=\"16\" y=\"15\" width=\"6\" height=\"6\" rx=\"1.2\"><\u002Frect><path d=\"M8 12h4M12 6v12M12 6h4M12 18h4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 19px; font-weight: 800; color: #0A2463\">Proceso de desarrollo base<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">Levantamos y definimos el proceso de desarrollo de software que hoy sigue tu organización. Es la base para ajustar el modelo agéntico a tu realidad, en vez de imponer uno genérico.<\u002Fp>\n<ul style=\"margin: 0; padding-left: 18px; font-size: 15px; display: flex; flex-direction: column; gap: 4px\">\n<li>Metodología, etapas y ceremonias actuales<\u002Fli>\n<li>Roles, responsabilidades y aprobaciones<\u002Fli>\n<li>Herramientas, controles de calidad y despliegue<\u002Fli>\n<li>Qué se mantiene, qué se ajusta y qué se transforma<\u002Fli>\n<\u002Ful>\n<\u002Farticle>\n<article style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"width: 48px; height: 48px; border-radius: 50%; background: #0FA39A; display: flex; align-items: center; justify-content: center\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 12a9 9 0 01-15.5 6.2\"><\u002Fpath><path d=\"M3 12a9 9 0 0115.5-6.2\"><\u002Fpath><path d=\"M18.5 2v4h-4M5.5 22v-4h4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 19px; font-weight: 800; color: #0A2463\">Gestión del cambio<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">Apoyo a la organización para que el nuevo modelo se adopte y no se quede en el papel. Parte al inicio y acompaña todas las fases.<\u002Fp>\n<ul style=\"margin: 0; padding-left: 18px; font-size: 15px; display: flex; flex-direction: column; gap: 4px\">\n<li>Mapa de actores, patrocinadores y puntos de resistencia<\u002Fli>\n<li>Transformación de roles: de Scrum Master y Product Owner a los nuevos roles del modelo<\u002Fli>\n<li>Plan de comunicación y adopción por oleadas<\u002Fli>\n<li>Seguimiento de adopción junto a las métricas técnicas<\u002Fli>\n<\u002Ful>\n<\u002Farticle>\n<article style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"width: 48px; height: 48px; border-radius: 50%; background: #0FA39A; display: flex; align-items: center; justify-content: center\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"12\" rx=\"2\"><\u002Frect><path d=\"M8 20h8M12 16v4\"><\u002Fpath><path d=\"M7 9l3 2-3 2M12 13h4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 19px; font-weight: 800; color: #0A2463\">Talleres<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">Aprendizaje práctico sobre tu propio caso, para liderazgo y equipos, antes de tocar el código.<\u002Fp>\n<ul style=\"margin: 0; padding-left: 18px; font-size: 15px; display: flex; flex-direction: column; gap: 4px\">\n<li>Sensibilización para liderazgo: el cambio de cuello de botella<\u002Fli>\n<li>Taller vivencial: construir los cinco artefactos sobre un caso real<\u002Fli>\n<li>Simulación multiagente: decidir dónde interviene un humano<\u002Fli>\n<li>Plan personal de transformación de rol<\u002Fli>\n<\u002Ful>\n<\u002Farticle>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 40px\">\n<span style=\"font-size: 13px; font-weight: 700; color: #FFFFFF; background: #1E5BD8; padding: 6px 14px; border-radius: 999px\">Etapa 2 · Implementación<\u002Fspan>\n<span style=\"font-size: 16px; font-weight: 700; color: #0A2463\">Diseño, ambiente y piloto<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; margin-top: 16px\">\n<article style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 16px; padding: 28px; display: flex; gap: 18px; align-items: flex-start\">\n<div style=\"width: 48px; height: 48px; border-radius: 50%; background: #1E5BD8; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"><\u002Frect><\u002Fsvg><\u002Fdiv>\n<div><h3 style=\"margin: 0 0 6px; font-size: 19px; font-weight: 800; color: #0A2463\">Diseño del sistema IDA a tu medida<\u002Fh3>\n<p style=\"margin: 0 0 12px; font-size: 15px\">Ajustamos el marco al proceso de desarrollo de tu organización: artefactos, roles, eventos, métricas y niveles de autonomía.<\u002Fp>\n<ul style=\"margin: 0; padding-left: 18px; font-size: 15px; display: flex; flex-direction: column; gap: 4px\">\n<li>Plantillas de los cinco artefactos para tu contexto<\u002Fli>\n<li>Mapa de Autonomía y puntos de aprobación<\u002Fli>\n<li>Qué se conserva de tu proceso actual y qué se transforma<\u002Fli>\n<\u002Ful><\u002Fdiv>\n<\u002Farticle>\n<article style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 16px; padding: 28px; display: flex; gap: 18px; align-items: flex-start\">\n<div style=\"width: 48px; height: 48px; border-radius: 50%; background: #1E5BD8; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 9l-4 3 4 3M16 9l4 3-4 3M13 6l-2 12\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div><h3 style=\"margin: 0 0 6px; font-size: 19px; font-weight: 800; color: #0A2463\">Puesta en marcha del ambiente (Día 0)<\u002Fh3>\n<p style=\"margin: 0 0 12px; font-size: 15px\">Dejamos armado todo lo que debe existir antes de darle autonomía real a un agente sobre tu repositorio.<\u002Fp>\n<ul style=\"margin: 0; padding-left: 18px; font-size: 15px; display: flex; flex-direction: column; gap: 4px\">\n<li>Instrucciones para agentes (AGENTS.md / CLAUDE.md) y habilidades reutilizables (SKILL.md)<\u002Fli>\n<li>Arnés de control: permisos, entornos aislados, manejo de secretos y trazabilidad<\u002Fli>\n<li>Memoria, gestión de contexto y conectores con mínimo privilegio<\u002Fli>\n<li>Casos de prueba de referencia y control mínimo de integración y despliegue continuo (CI/CD)<\u002Fli>\n<\u002Ful><\u002Fdiv>\n<\u002Farticle>\n<article style=\"background: #E6F6F4; border: 1px solid #A9DDD7; border-radius: 16px; padding: 28px; display: flex; gap: 18px; align-items: flex-start\">\n<div style=\"width: 48px; height: 48px; border-radius: 50%; background: #0FA39A; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 19c4-1 6-3 7-7 1 4 3 6 7 7\"><\u002Fpath><path d=\"M12 12V3M8 7l4-4 4 4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<div><h3 style=\"margin: 0 0 6px; font-size: 19px; font-weight: 800; color: #0A2463\">Piloto acompañado y transferencia<\u002Fh3>\n<p style=\"margin: 0 0 12px; font-size: 15px\">Ejecutamos con tu equipo un caso real de punta a punta y transferimos la capacidad para que sigan solos.<\u002Fp>\n<ul style=\"margin: 0; padding-left: 18px; font-size: 15px; display: flex; flex-direction: column; gap: 4px\">\n<li>Un módulo real construido con agentes bajo el framework<\u002Fli>\n<li>Primeros eventos facilitados junto a tu equipo<\u002Fli>\n<li>Plan de escalamiento hacia más equipos y más autonomía<\u002Fli>\n<\u002Ful><\u002Fdiv>\n<\u002Farticle>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- PROCESO -->\n<section id=\"proceso\" style=\"padding: clamp(48px, 6vw, 80px) clamp(16px, 5vw, 64px); background: #FFFFFF; border-top: 1px solid #DCE5F2; border-bottom: 1px solid #DCE5F2\">\n<div style=\"max-width: 1240px; margin: 0 auto\">\n<div style=\"display: flex; align-items: center; gap: 14px\">\n<div style=\"width: 48px; height: 48px; border-radius: 50%; background: #1E5BD8; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 12h4l3-8 4 16 3-8h4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h2 style=\"margin: 0; font-size: clamp(1.6rem, 2.6vw, 2.2rem); font-weight: 800; color: #0A2463; line-height: 1.2\">Cómo trabajamos: adopción incremental<\u002Fh2>\n<\u002Fdiv>\n<p style=\"margin: 16px 0 0; max-width: 860px; font-size: 1.05rem; line-height: 1.8\">Partimos del proceso de desarrollo que tu organización ya tiene y lo ajustamos al modelo agéntico. No implementamos los cinco artefactos el mismo día. Avanzamos eslabón por eslabón, con un entregable verificable al cierre de cada fase. La gestión del cambio acompaña todo el recorrido. Los plazos de cada fase se definen en la propuesta y en la reunión de inicio del proyecto.<\u002Fp>\n<ol style=\"margin: 32px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 16px\">\n<li style=\"background: #F3F6FB; border: 1px solid #DCE5F2; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"display: flex; align-items: center; justify-content: space-between\"><span style=\"width: 40px; height: 40px; border-radius: 50%; background: #0A2463; color: #FFFFFF; font-weight: 800; display: flex; align-items: center; justify-content: center\">1<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 17px; font-weight: 800; color: #0A2463\">Diagnóstico, cambio y talleres<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">Diagnóstico técnico y organizacional, levantamiento del proceso de desarrollo actual, plan de gestión del cambio, talleres de arranque y primera Acta de Intención.<\u002Fp>\n<\u002Fli>\n<li style=\"background: #F3F6FB; border: 1px solid #DCE5F2; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"display: flex; align-items: center; justify-content: space-between\"><span style=\"width: 40px; height: 40px; border-radius: 50%; background: #0A2463; color: #FFFFFF; font-weight: 800; display: flex; align-items: center; justify-content: center\">2<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 17px; font-weight: 800; color: #0A2463\">Puesta en marcha del ambiente<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">Herramienta agéntica, instrucciones, habilidades, arnés, memoria y Registro de Contexto mínimo. Agentes con autonomía baja.<\u002Fp>\n<\u002Fli>\n<li style=\"background: #F3F6FB; border: 1px solid #DCE5F2; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"display: flex; align-items: center; justify-content: space-between\"><span style=\"width: 40px; height: 40px; border-radius: 50%; background: #0A2463; color: #FFFFFF; font-weight: 800; display: flex; align-items: center; justify-content: center\">3<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 17px; font-weight: 800; color: #0A2463\">Especificaciones y Control de Confianza<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">Requerimientos del piloto convertidos en especificaciones verificables; pruebas automáticas y umbrales que bloquean el paso a producción.<\u002Fp>\n<\u002Fli>\n<li style=\"background: #F3F6FB; border: 1px solid #DCE5F2; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"display: flex; align-items: center; justify-content: space-between\"><span style=\"width: 40px; height: 40px; border-radius: 50%; background: #0A2463; color: #FFFFFF; font-weight: 800; display: flex; align-items: center; justify-content: center\">4<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 17px; font-weight: 800; color: #0A2463\">Piloto con Mapa de Decisión<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">Caso real supervisado, de la intención al despliegue. La autonomía sube solo con evidencia.<\u002Fp>\n<\u002Fli>\n<li style=\"background: #E6F6F4; border: 1px solid #A9DDD7; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"display: flex; align-items: center; justify-content: space-between\"><span style=\"width: 40px; height: 40px; border-radius: 50%; background: #0FA39A; color: #FFFFFF; font-weight: 800; display: flex; align-items: center; justify-content: center\">5<\u002Fspan><\u002Fdiv>\n<h3 style=\"margin: 0; font-size: 17px; font-weight: 800; color: #0A2463\">Ciclo de aprendizaje y transferencia<\u002Fh3>\n<p style=\"margin: 0; font-size: 15px\">Primera revisión de aprendizaje, métricas en marcha y plan de escalamiento por oleadas.<\u002Fp>\n<\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- MADUREZ + ENTREGABLES -->\n<section style=\"padding: clamp(48px, 6vw, 80px) clamp(16px, 5vw, 64px)\">\n<div style=\"max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 24px\">\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 16px; padding: 32px\">\n<div style=\"display: flex; align-items: center; gap: 14px; margin-bottom: 12px\">\n<div style=\"width: 44px; height: 44px; border-radius: 50%; background: #1E5BD8; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 20V14M10 20V10M16 20V6M22 20H2\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h2 style=\"margin: 0; font-size: 1.4rem; font-weight: 800; color: #0A2463; line-height: 1.25\">De un uso suelto de IA a un sistema gobernado<\u002Fh2>\n<\u002Fdiv>\n<p style=\"margin: 0 0 20px; font-size: 15px\">La asesoría lleva a un equipo de los niveles 0–1 a operar con solidez en los niveles 2–3, con el camino trazado hacia el 4.<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 8px; font-size: 15px\">\n<div style=\"display: flex; align-items: center; gap: 14px; padding: 12px 14px; background: #F3F6FB; border-radius: 10px\"><span style=\"width: 28px; height: 28px; border-radius: 50%; background: #B9CBEA; color: #0A2463; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0\">0<\u002Fspan>Uso individual y ad hoc de asistentes<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 14px; padding: 12px 14px; background: #F3F6FB; border-radius: 10px\"><span style=\"width: 28px; height: 28px; border-radius: 50%; background: #B9CBEA; color: #0A2463; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0\">1<\u002Fspan>Agentes en el equipo, sin artefactos comunes<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 14px; padding: 12px 14px; background: #E3EEFF; border: 1px solid #B9CBEA; border-radius: 10px; color: #0A2463; font-weight: 700\"><span style=\"width: 28px; height: 28px; border-radius: 50%; background: #1E5BD8; color: #FFFFFF; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0\">2<\u002Fspan>Especificaciones, contexto y controles funcionando en un piloto<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 14px; padding: 12px 14px; background: #E3EEFF; border: 1px solid #B9CBEA; border-radius: 10px; color: #0A2463; font-weight: 700\"><span style=\"width: 28px; height: 28px; border-radius: 50%; background: #1E5BD8; color: #FFFFFF; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0\">3<\u002Fspan>Gobernanza explícita y autonomía basada en evidencia<\u002Fdiv>\n<div style=\"display: flex; align-items: center; gap: 14px; padding: 12px 14px; background: #F3F6FB; border-radius: 10px\"><span style=\"width: 28px; height: 28px; border-radius: 50%; background: #B9CBEA; color: #0A2463; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0\">4<\u002Fspan>Adaptativo: el sistema mide su propio aprendizaje<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 16px; padding: 32px\">\n<div style=\"display: flex; align-items: center; gap: 14px; margin-bottom: 12px\">\n<div style=\"width: 44px; height: 44px; border-radius: 50%; background: #0FA39A; display: flex; align-items: center; justify-content: center; flex-shrink: 0\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 8l-9-5-9 5 9 5 9-5z\"><\u002Fpath><path d=\"M3 8v8l9 5 9-5V8\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<h2 style=\"margin: 0; font-size: 1.4rem; font-weight: 800; color: #0A2463; line-height: 1.25\">Lo que queda en tu organización<\u002Fh2>\n<\u002Fdiv>\n<ul style=\"margin: 8px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 15px\">\n<li style=\"display: flex; gap: 12px; align-items: flex-start\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0FA39A\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 2px\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg>Informe de diagnóstico de madurez y brechas por eslabón<\u002Fli>\n<li style=\"display: flex; gap: 12px; align-items: flex-start\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0FA39A\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 2px\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg>Proceso de desarrollo de la organización documentado y ajustado al modelo agéntico<\u002Fli>\n<li style=\"display: flex; gap: 12px; align-items: flex-start\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0FA39A\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 2px\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg>Plan de gestión del cambio con mapa de actores y nuevos roles<\u002Fli>\n<li style=\"display: flex; gap: 12px; align-items: flex-start\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0FA39A\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 2px\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg>Talleres realizados, con material para replicarlos internamente<\u002Fli>\n<li style=\"display: flex; gap: 12px; align-items: flex-start\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0FA39A\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 2px\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg>Los cinco artefactos IDA instanciados en tu proyecto piloto<\u002Fli>\n<li style=\"display: flex; gap: 12px; align-items: flex-start\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0FA39A\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 2px\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg>Repositorio base: instrucciones para agentes, habilidades, arnés y configuración del ambiente<\u002Fli>\n<li style=\"display: flex; gap: 12px; align-items: flex-start\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0FA39A\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 2px\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg>Mapa de Autonomía, puntos de aprobación y roles asignados<\u002Fli>\n<li style=\"display: flex; gap: 12px; align-items: flex-start\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0FA39A\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 2px\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg>Tablero de métricas agénticas con línea base<\u002Fli>\n<li style=\"display: flex; gap: 12px; align-items: flex-start\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0FA39A\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex-shrink: 0; margin-top: 2px\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg>Plan de escalamiento por oleadas hacia otros equipos<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- PARA QUIÉN -->\n<section style=\"padding: 0 clamp(16px, 5vw, 64px) clamp(48px, 6vw, 80px)\">\n<div style=\"max-width: 1240px; margin: 0 auto\">\n<h2 style=\"margin: 0 0 20px; font-size: 1.4rem; font-weight: 800; color: #0A2463\">Para quién es<\u002Fh2>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px\">\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 16px; padding: 24px; text-align: center\">\n<svg width=\"36\" height=\"36\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0A2463\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6\"><\u002Fpath><\u002Fsvg>\n<div style=\"font-weight: 800; color: #1E5BD8; margin-top: 8px\">Gerencias de tecnología<\u002Fdiv><div style=\"font-size: 14px; margin-top: 4px\">Que necesitan pasar de pilotos aislados con IA a una forma de trabajo gobernada, medible y auditable.<\u002Fdiv><\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 16px; padding: 24px; text-align: center\">\n<svg width=\"36\" height=\"36\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0A2463\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 9l-4 3 4 3M16 9l4 3-4 3M13 6l-2 12\"><\u002Fpath><\u002Fsvg>\n<div style=\"font-weight: 800; color: #1E5BD8; margin-top: 8px\">Líderes técnicos y arquitectos<\u002Fdiv><div style=\"font-size: 14px; margin-top: 4px\">Que ven más código generado que nunca y menos certeza sobre lo que llega a producción.<\u002Fdiv><\u002Fdiv>\n<div style=\"background: #FFFFFF; border: 1px solid #DCE5F2; border-radius: 16px; padding: 24px; text-align: center\">\n<svg width=\"36\" height=\"36\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0A2463\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"8\" r=\"3\"><\u002Fcircle><path d=\"M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6\"><\u002Fpath><path d=\"M16 5.5a3 3 0 010 5.5M18 14.5c1.8.9 3 2.9 3 5.5\"><\u002Fpath><\u002Fsvg>\n<div style=\"font-weight: 800; color: #1E5BD8; margin-top: 8px\">Equipos ágiles en transición<\u002Fdiv><div style=\"font-size: 14px; margin-top: 4px\">Scrum Masters, Product Owners y desarrolladores que quieren entender su rol en el nuevo modelo.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- FAQ -->\n<section id=\"preguntas\" style=\"padding: clamp(48px, 6vw, 80px) clamp(16px, 5vw, 64px); background: #FFFFFF; border-top: 1px solid #DCE5F2\">\n<div style=\"max-width: 900px; margin: 0 auto\">\n<h2 style=\"margin: 0 0 24px; font-size: clamp(1.6rem, 2.6vw, 2.2rem); font-weight: 800; color: #0A2463\">Preguntas frecuentes<\u002Fh2>\n<div style=\"display: flex; flex-direction: column; gap: 12px\">\n<div style=\"background: #F3F6FB; border: 1px solid #DCE5F2; border-radius: 14px; padding: 20px 24px\"><h3 style=\"margin: 0 0 6px; font-size: 17px; font-weight: 800; color: #0A2463\">¿Tenemos que abandonar Scrum?<\u002Fh3><p style=\"margin: 0; font-size: 15px\">No. Se conserva la iteración corta, la transparencia y la retrospectiva, reorientadas hacia verificación y aprendizaje del sistema. Partimos de tu proceso actual y lo ajustamos; lo que se descarta es la estimación en puntos de historia como medida de capacidad.<\u002Fp><\u002Fdiv>\n<div style=\"background: #F3F6FB; border: 1px solid #DCE5F2; border-radius: 14px; padding: 20px 24px\"><h3 style=\"margin: 0 0 6px; font-size: 17px; font-weight: 800; color: #0A2463\">¿Está atada a una herramienta?<\u002Fh3><p style=\"margin: 0; font-size: 15px\">El framework es agnóstico. La puesta en marcha se apoya en Claude Code, con equivalencias para otras herramientas agénticas que tu equipo ya use.<\u002Fp><\u002Fdiv>\n<div style=\"background: #F3F6FB; border: 1px solid #DCE5F2; border-radius: 14px; padding: 20px 24px\"><h3 style=\"margin: 0 0 6px; font-size: 17px; font-weight: 800; color: #0A2463\">¿Sirve para un sistema que ya existe?<\u002Fh3><p style=\"margin: 0; font-size: 15px\">Sí. El piloto puede ser un proyecto nuevo o un módulo de un sistema existente; el diagnóstico define cuál conviene para generar evidencia rápido y con riesgo acotado.<\u002Fp><\u002Fdiv>\n<div style=\"background: #F3F6FB; border: 1px solid #DCE5F2; border-radius: 14px; padding: 20px 24px\"><h3 style=\"margin: 0 0 6px; font-size: 17px; font-weight: 800; color: #0A2463\">¿Qué necesita poner nuestro equipo?<\u002Fh3><p style=\"margin: 0; font-size: 15px\">Un caso real, acceso al repositorio y a las personas que deciden. El trabajo se hace sobre tu contexto, no sobre ejemplos genéricos.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- CTA -->\n<section id=\"contacto\" style=\"padding: clamp(48px, 6vw, 80px) clamp(16px, 5vw, 64px)\">\n<div style=\"max-width: 1240px; margin: 0 auto; background: #0A2463; border-radius: 20px; padding: clamp(32px, 5vw, 56px); display: flex; flex-wrap: wrap; gap: 32px; align-items: center; justify-content: space-between\">\n<div style=\"flex: 999 1 460px; min-width: 0\">\n<h2 style=\"margin: 0; font-size: clamp(1.8rem, 3.2vw, 2.6rem); font-weight: 800; line-height: 1.15; color: #FFFFFF\">Empieza por saber en qué eslabón se rompe tu cadena.<\u002Fh2>\n<div style=\"width: 64px; height: 4px; background: #0FA39A; border-radius: 4px; margin: 20px 0\"><\u002Fdiv>\n<p style=\"margin: 0; max-width: 620px; font-size: 1.05rem; color: #B8C6E0\">Una primera conversación para revisar tu situación actual y definir si la asesoría es el siguiente paso correcto.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 12px\">\n<a href=\"mailto:richard.reyes@amlia.cl?subject=Diagn%C3%B3stico%20de%20desarrollo%20ag%C3%A9ntico\" style=\"display: inline-flex; align-items: center; justify-content: center; min-height: 56px; padding: 0 28px; background: #FFFFFF; color: #0A2463; text-decoration: none; font-weight: 800; font-size: 16px; border-radius: 12px\">Agendar diagnóstico<\u002Fa>\n<div style=\"display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 15px; color: #B8C6E0; text-align: center\">\n<span style=\"color: #FFFFFF; font-weight: 700\">Richard Reyes<\u002Fspan>\n<a href=\"mailto:richard.reyes@amlia.cl\" style=\"color: #7FC4FF; text-decoration: none; display: inline-flex; align-items: center; min-height: 32px\">richard.reyes@amlia.cl<\u002Fa>\n<a href=\"tel:+56961704164\" style=\"color: #7FC4FF; text-decoration: none; display: inline-flex; align-items: center; min-height: 32px\">+56 9 6170 4164<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"background: #FFFFFF; border-top: 1px solid #DCE5F2; padding: 24px clamp(16px, 5vw, 64px)\">\n<div style=\"max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; font-size: 14px; color: #5A6880\">\n<span>Asesoría en Ingeniería del Desarrollo Agéntico (IDA)<\u002Fspan>\n<span>© 2026 Richard Reyes · richard.reyes@amlia.cl · +56 9 6170 4164<\u002Fspan>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:7400}}\">\nclass Component extends DCLogic {\nrenderVals() {\nreturn {};\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
